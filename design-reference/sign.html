<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LifeLine | Join the Network</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed": "#1b1b1c",
                    "surface-tint": "#b52619",
                    "tertiary-fixed-dim": "#c1c7cf",
                    "on-tertiary-container": "#a9b0b7",
                    "secondary-fixed-dim": "#c8c6c7",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "surface": "#f8f9ff",
                    "tertiary": "#272d33",
                    "inverse-surface": "#213145",
                    "primary-fixed": "#ffdad4",
                    "primary-fixed-dim": "#ffb4a8",
                    "on-primary-fixed-variant": "#920703",
                    "error-container": "#ffdad6",
                    "surface-container": "#e5eeff",
                    "surface-dim": "#cbdbf5",
                    "on-background": "#0b1c30",
                    "on-secondary-fixed-variant": "#474647",
                    "surface-container-high": "#dce9ff",
                    "on-surface": "#0b1c30",
                    "secondary": "#5f5e5f",
                    "surface-container-highest": "#d3e4fe",
                    "outline-variant": "#e3beb8",
                    "primary-container": "#8b0000",
                    "on-surface-variant": "#5a403c",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed": "#410000",
                    "surface-variant": "#d3e4fe",
                    "inverse-primary": "#ffb4a8",
                    "secondary-fixed": "#e5e2e3",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed-variant": "#41474e",
                    "tertiary-fixed": "#dde3eb",
                    "outline": "#8e706b",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#3d4349",
                    "on-primary-container": "#ff907f",
                    "background": "#f8f9ff",
                    "on-tertiary-fixed": "#161c22",
                    "surface-bright": "#f8f9ff",
                    "inverse-on-surface": "#eaf1ff",
                    "on-primary": "#ffffff",
                    "on-secondary-container": "#636263",
                    "secondary-container": "#e2dfe0",
                    "surface-container-low": "#eff4ff",
                    "primary": "#610000",
                    "surface-container-lowest": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit": "8px",
                    "gutter": "24px",
                    "container-max": "1280px",
                    "margin-desktop": "40px",
                    "section-gap": "64px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "headline-md": ["Atkinson Hyperlegible Next"],
                    "headline-lg-mobile": ["Atkinson Hyperlegible Next"],
                    "display-timer": ["Atkinson Hyperlegible Next"],
                    "body-md": ["Inter"],
                    "label-caps": ["JetBrains Mono"],
                    "data-metric": ["JetBrains Mono"],
                    "headline-lg": ["Atkinson Hyperlegible Next"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "display-timer": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-caps": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "data-metric": ["20px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f8f9ff;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease;
        }
        .dark body {
            background-color: #0b1c30;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .donor-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 0;
        }
        .donor-section.active {
            max-height: 500px;
            opacity: 1;
        }
        .glass-background {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- Top Navigation Placeholder (Hidden for transactional flow per rules) -->
<!-- The prompt is for a Login/Signup screen, so Shell is suppressed per "Relevance Check" rule -->
<main class="w-full max-w-md bg-white dark:bg-on-background rounded-xl shadow-lg border border-outline-variant dark:border-outline p-8 relative overflow-hidden">
<!-- Header Section -->
<div class="mb-8 text-center">
<div class="inline-flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim text-4xl" data-icon="bloodtype" style="font-variation-settings: 'FILL' 1;">bloodtype</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 tracking-tight">LifeLine</h1>
<p class="font-body-md text-body-md text-secondary">Every drop is a heartbeat. Join the emergency network.</p>
</div>
<!-- Mode Toggle (Micro-interaction) -->
<button class="absolute top-4 right-4 p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200" onclick="toggleTheme()">
<span class="material-symbols-outlined text-secondary" data-icon="dark_mode" id="theme-icon">dark_mode</span>
</button>
<!-- Auth Form -->
<form class="space-y-6" id="authForm">
<!-- Standard Fields -->
<div class="space-y-4">
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="identifier">Email or Phone</label>
<input class="w-full bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg p-3 font-body-md text-on-surface transition-all" id="identifier" placeholder="e.g. name@hospital.com" type="text"/>
</div>
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg p-3 font-body-md text-on-surface transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-3 text-secondary-fixed-dim hover:text-secondary" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Donor Toggle -->
<div class="flex items-center justify-between p-4 bg-surface-container-low dark:bg-tertiary-container rounded-xl border border-outline-variant dark:border-outline">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container dark:text-on-primary-container" data-icon="volunteer_activism">volunteer_activism</span>
<span class="font-body-md font-semibold text-on-surface">I'm a donor</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" id="donorToggle" onchange="toggleDonorFields()" type="checkbox"/>
<div class="w-11 h-6 bg-secondary-fixed peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- Revealed Donor Section -->
<div class="donor-section space-y-6" id="donorSection">
<div class="pt-4">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3">Blood Type</label>
<div class="grid grid-cols-4 gap-2">
<!-- Blood Type Chips -->
<button class="blood-chip py-2 px-1 border border-outline-variant rounded bg-surface-container-lowest font-label-caps text-on-surface hover:bg-primary-container hover:text-white transition-all" type="button">A+</button>
<button class="blood-chip py-2 px-1 border border-outline-variant rounded bg-surface-container-lowest font-label-caps text-on-surface hover:bg-primary-container hover:text-white transition-all" type="button">A-</button>
<button class="blood-chip py-2 px-1 border border-outline-variant rounded bg-surface-container-lowest font-label-caps text-on-surface hover:bg-primary-container hover:text-white transition-all" type="button">B+</button>
<button class="blood-chip py-2 px-1 border border-outline-variant rounded bg-surface-container-lowest font-label-caps text-on-surface hover:bg-primary-container hover:text-white transition-all" type="button">B-</button>
<button class="blood-chip py-2 px-1 border border-outline-variant rounded bg-surface-container-lowest font-label-caps text-on-surface hover:bg-primary-container hover:text-white transition-all" type="button">O+</button>
<button class="blood-chip py-2 px-1 border border-outline-variant rounded bg-surface-container-lowest font-label-caps text-on-surface hover:bg-primary-container hover:text-white transition-all" type="button">O-</button>
<button class="blood-chip py-2 px-1 border border-outline-variant rounded bg-surface-container-lowest font-label-caps text-on-surface hover:bg-primary-container hover:text-white transition-all" type="button">AB+</button>
<button class="blood-chip py-2 px-1 border border-outline-variant rounded bg-surface-container-lowest font-label-caps text-on-surface hover:bg-primary-container hover:text-white transition-all" type="button">AB-</button>
</div>
</div>
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="location">Location</label>
<div class="relative">
<span class="absolute left-3 top-3 material-symbols-outlined text-secondary text-sm" data-icon="location_on">location_on</span>
<input class="w-full pl-10 bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg p-3 font-body-md text-on-surface transition-all" id="location" placeholder="City or Zip Code" type="text"/>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl shadow-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Connect Now
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Switcher -->
<div class="text-center">
<p class="font-body-md text-secondary">
                    Already part of the network? 
                    <a class="text-primary dark:text-primary-fixed-dim font-semibold hover:underline" href="#">Log in</a>
</p>
</div>
</form>
</main>
<!-- Aesthetic Decorative Element -->
<div class="fixed inset-0 -z-10 opacity-30 pointer-events-none overflow-hidden">
<div class="absolute -top-1/4 -left-1/4 w-1/2 h-1/2 bg-primary-fixed rounded-full blur-[120px]"></div>
<div class="absolute -bottom-1/4 -right-1/4 w-1/2 h-1/2 bg-surface-container-highest rounded-full blur-[120px]"></div>
</div>
<script>
        function toggleDonorFields() {
            const checkbox = document.getElementById('donorToggle');
            const donorSection = document.getElementById('donorSection');
            if (checkbox.checked) {
                donorSection.classList.add('active');
            } else {
                donorSection.classList.remove('active');
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = 'dark_mode';
            } else {
                html.classList.add('dark');
                icon.innerText = 'light_mode';
            }
        }

        // Handle Blood Chip Selection
        document.querySelectorAll('.blood-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.blood-chip').forEach(c => {
                    c.classList.remove('bg-primary-container', 'text-white', 'border-primary-container');
                    c.classList.add('bg-surface-container-lowest', 'text-on-surface', 'border-outline-variant');
                });
                this.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'border-outline-variant');
                this.classList.add('bg-primary-container', 'text-white', 'border-primary-container');
            });
        });

        // Form Submission Logic
        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> Connecting...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert('Connection established. Welcome to LifeLine.');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
