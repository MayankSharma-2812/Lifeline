# Nginx Layer 7 Reverse Proxy & Load Balancer Configuration for LifeLine
# Demonstrates:
# - Layer 7 Reverse Proxy & SSL Termination
# - Upstream Load Balancing with ip_hash Sticky Sessions for WebSocket handshakes
# - HTTP to WebSocket Upgrade Header forwarding

events {
    worker_connections 1024;
}

http {
    # Upstream backend pool for horizontal scaling
    # ip_hash ensures session stickiness so Socket.io HTTP long-polling upgrades route to the same worker instance
    upstream lifeline_backend {
        ip_hash;
        server backend1:5000 max_fails=3 fail_timeout=10s;
        server backend2:5000 max_fails=3 fail_timeout=10s;
        server backend3:5000 backup;
    }

    # Upstream client pool (Vite / React static bundle)
    upstream lifeline_client {
        server client:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip compression for performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # API Endpoints -> Load balanced across backend instances
        location /api/ {
            proxy_pass http://lifeline_backend;
            proxy_http_version 1.1;

            # Header preservation for auditing & IP tracking
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # WebSocket / Socket.io Endpoints with Connection Upgrade
        location /socket.io/ {
            proxy_pass http://lifeline_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Prevent premature WebSocket disconnects
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health Probe Endpoint for L4/L7 Load Balancer health checking
        location /health {
            proxy_pass http://lifeline_backend/api/v1/health/live;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend SPA Static Assets & Client Routing
        location / {
            proxy_pass http://lifeline_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
