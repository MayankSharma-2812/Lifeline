version: '3.8'

services:
  # Nginx Layer 7 Load Balancer
  loadbalancer:
    image: nginx:alpine
    container_name: lifeline-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    restart: always

  # Backend Instance 1
  backend1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lifeline-backend-1
    environment:
      - NODE_ENV=production
      - PORT=5000
      - INSTANCE_ID=backend-1
    env_file:
      - ./server/.env
    restart: always

  # Backend Instance 2 (Horizontal Scale)
  backend2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lifeline-backend-2
    environment:
      - NODE_ENV=production
      - PORT=5000
      - INSTANCE_ID=backend-2
    env_file:
      - ./server/.env
    restart: always
